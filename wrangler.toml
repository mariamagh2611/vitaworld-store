name = "vitaworld-store"
main = "worker/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true

[assets]
directory = "dist"
binding = "ASSETS"
html_handling = "none"
run_worker_first = ["/", "/admin", "/admin/*", "/api/*", "/products/*", "/shop/*", "/offers/*", "/checkout", "/policies/*", "/media/*", "/demo/*", "/sitemap.xml", "/robots.txt"]

[triggers]
crons = ["* * * * *"]

[vars]
ENVIRONMENT = "production"
MEDIA_ORIGIN = "/media"
INSTALLATION_MODE = "cloudflare-button"

[[d1_databases]]
binding = "DB"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"

[[r2_buckets]]
binding = "BACKUPS"

[[durable_objects.bindings]]
name = "PASSWORD_HASHER"
class_name = "PasswordHasher"

[[durable_objects.bindings]]
name = "OPERATIONS"
class_name = "StoreOperations"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PasswordHasher", "StoreOperations"]
